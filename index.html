<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3U8 下载器 · NØME</title>
<script src="/assets/nome77-theme.js"></script>
<link rel="stylesheet" href="/assets/nome77-tokens.css">
<link rel="icon" href="/assets/nome77-favicon.svg" type="image/svg+xml">
<style>
  :root {
    font-family: var(--nome77-font-sans);
    color: var(--nome77-text);
    background: var(--nome77-background);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-size: 14px; }
  h1, h2, p { margin: 0; }
  .shell { width: min(100%, 1144px); margin-inline: auto; padding-inline: 32px; }
  .topbar { border-bottom: 1px solid var(--nome77-border-subtle); background: var(--nome77-surface); }
  .nav { min-height: var(--nome77-nav-height); display: flex; align-items: center; gap: 16px; }
  .brand { display: inline-flex; align-items: center; gap: var(--nome77-brand-gap); text-decoration: none;
    color: var(--nome77-text); font-size: 16px; font-weight: 650; letter-spacing: .01em; }
  .brand img { width: var(--nome77-brand-icon-size); height: var(--nome77-brand-icon-size); }
  :root:not([data-theme="light"]) .nome77-mark-light,
  :root[data-theme="light"] .nome77-mark-dark { display: none; }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .theme { display: flex; align-items: center; gap: 8px; color: var(--nome77-text-muted); }
  .nav select, .nav button { min-height: 36px; }
  .nav select { width: auto; }
  main { padding-block: 32px 48px; }
  .page-head { margin-bottom: 24px; }
  h1 { font-size: clamp(25px, 4vw, 32px); line-height: 1.24; font-weight: 600; letter-spacing: -.035em; }
  h2 { font-size: 15px; line-height: 22px; font-weight: 600; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; gap: 24px; }
  .card { min-width: 0; border: 1px solid var(--nome77-border-subtle); border-radius: var(--nome77-radius-panel);
    background: var(--nome77-surface); }
  .panel-head { min-height: 60px; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px; border-bottom: 1px solid var(--nome77-border-subtle); }
  .panel-body { padding: 20px 24px; }
  .field { display: grid; gap: 8px; margin-bottom: 16px; }
  label { font-weight: 550; font-size: 13px; }
  .field-row { display: flex; gap: 8px; }
  input, button, select { font: inherit; }
  input, select, button { min-height: 42px; padding: 0 12px; border: 1px solid var(--nome77-border-control);
    background: var(--nome77-surface-raised); border-radius: var(--nome77-radius-control); color: var(--nome77-text); }
  input, select { min-width: 0; width: 100%; }
  input::placeholder { color: var(--nome77-text-muted); }
  :is(input, button, select, summary, a):focus-visible { outline: 2px solid var(--nome77-focus); outline-offset: 3px; }
  .mono { font-family: var(--nome77-font-mono); }
  .hint { color: var(--nome77-text-muted); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
  button { cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 550;
    transition: background var(--nome77-transition), border-color var(--nome77-transition); }
  button:hover:not(:disabled) { background: var(--nome77-background); border-color: var(--nome77-focus); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--nome77-text); color: var(--nome77-background); border-color: var(--nome77-text);
    width: 100%; min-height: 44px; font-size: 14px; }
  button.primary:hover:not(:disabled) { background: var(--nome77-focus); border-color: var(--nome77-focus); }
  .state { display: inline-flex; align-items: center; gap: 6px; color: var(--nome77-text-muted); font-size: 12px;
    white-space: nowrap; border: 1px solid var(--nome77-border-subtle); border-radius: var(--nome77-radius-label); padding: 4px 8px; }
  .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .state[data-state="running"] { color: var(--nome77-warning); }
  .state[data-state="complete"] { color: var(--nome77-success); }
  .state[data-state="error"], .state[data-state="offline"] { color: var(--nome77-danger); }
  .phase { color: var(--nome77-text-muted); line-height: 1.6; overflow-wrap: anywhere; }
  .progress-heading { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px;
    gap: 8px; color: var(--nome77-text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .percentage { font-size: 22px; font-weight: 600; color: var(--nome77-text); }
  progress { display: block; width: 100%; height: 7px; margin-top: 8px; border: 0; border-radius: 4px;
    background: var(--nome77-border-control); overflow: hidden; appearance: none; }
  progress::-webkit-progress-bar { background: var(--nome77-border-control); }
  progress::-webkit-progress-value { background: var(--nome77-text); }
  progress::-moz-progress-bar { background: var(--nome77-text); }
  .message { font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; margin-top: 12px; }
  .error { color: var(--nome77-danger); }
  .result { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--nome77-border-subtle); }
  .result p { overflow-wrap: anywhere; font-size: 12px; color: var(--nome77-text-muted); margin: 8px 0 12px; }
  details { border-top: 1px solid var(--nome77-border-subtle); }
  summary { cursor: pointer; color: var(--nome77-text-muted); font-size: 13px; line-height: 24px; padding: 8px 0; }
  summary:hover { color: var(--nome77-text); }
  pre { margin: 8px 0 0; padding: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap;
    overflow-wrap: anywhere; background: var(--nome77-background); border: 1px solid var(--nome77-border-subtle);
    border-radius: var(--nome77-radius-control); font: 11px/1.55 var(--nome77-font-mono); }
  #details { margin-top: 16px; }
  dialog.card { width: min(520px, 100% - 32px); padding: 24px; color: var(--nome77-text);
    background: var(--nome77-surface-raised); border-color: var(--nome77-border-control); }
  dialog::backdrop { background: #090b0d9c; }
  dialog p { margin: 12px 0; overflow-wrap: anywhere; }
  dialog form { margin-top: 8px; }
  .folder-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .folder-list { display: grid; gap: 6px; max-height: 32vh; overflow: auto; margin: 12px 0; }
  .folder-list button { text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .source-tools { margin: 0; }
  .source-tools[open] { padding-bottom: 12px; }
  .source-tools:last-of-type { border-bottom: 1px solid var(--nome77-border-subtle); margin-bottom: 16px; }
  .source-tools .field { margin-bottom: 12px; }
  .source-tools + .field { margin-top: 16px; }
  .source-note { margin-top: 8px; }
  #source-options label { display: block; margin-bottom: 8px; }
  a { color: var(--nome77-text); text-underline-offset: 3px; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    .shell { padding-inline: 16px; }
    main { padding-block: 28px 32px; }
    .layout { grid-template-columns: 1fr; gap: 16px; }
    .page-head { margin-bottom: 20px; }
    .panel-head, .panel-body { padding-inline: 16px; }
    .nav { flex-wrap: wrap; gap: 8px; padding-block: 8px; }
    .nav-actions { gap: 8px; }
    .theme { gap: 6px; }
  }
  @media (max-width: 370px) {
    .nav-actions { width: 100%; margin-left: 0; justify-content: space-between; }
  }
</style>
</head>
<body>
<header class="topbar">
  <nav class="shell nav" aria-label="应用导航">
    <a class="brand" href="/">
      <img class="nome77-mark-dark" src="/assets/nome77-icon.svg" width="32" height="32" alt="">
      <img class="nome77-mark-light" src="/assets/nome77-logo-light.svg" width="32" height="32" alt="">
      <span>NØME</span>
    </a>
    <div class="nav-actions">
      <label class="theme">
        <span>主题</span>
        <select data-nome77-theme>
          <option value="system">跟随系统</option>
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select>
      </label>
      <button type="button" id="exit">关闭服务</button>
    </div>
  </nav>
</header>
<main class="shell">
  <div class="page-head"><h1>M3U8 下载器</h1></div>
  <div class="layout">
    <form id="download" class="card">
      <div class="panel-head"><h2>下载设置</h2></div>
      <div class="panel-body">
      <div class="field">
        <label for="page">ikanbot 播放页或编号</label>
        <div class="field-row">
          <input class="mono" id="page" placeholder="播放页链接或数字编号">
          <button type="button" id="resolve">查找线路</button>
        </div>
        <p class="hint source-note" id="resolve-note" role="status" hidden></p>
        <div id="source-options" hidden>
          <label for="sources">选择线路</label>
          <select id="sources"></select>
          <p class="hint source-note">「中字」是网站标记。压进画面的字幕会随片源保留。</p>
        </div>
      </div>
      <details class="source-tools">
        <summary>一键从播放页导入</summary>
        <div class="hint source-note">把 <a id="bookmark" href="#">导入到 M3U8 下载器</a> 拖到浏览器书签栏。启动下载器后，在 ikanbot 播放页点击这个书签。</div>
      </details>
      <details class="source-tools" id="manual">
        <summary>手动输入 M3U8 链接</summary>
        <div class="field">
          <label for="url">M3U8 链接</label>
          <div class="field-row">
            <input class="mono" id="url" type="url" placeholder="https://…/index.m3u8">
            <button type="button" id="paste">粘贴</button>
          </div>
        </div>
        <div class="field">
          <label for="number">播放页编号</label>
          <input class="mono" id="number" inputmode="numeric" pattern="[0-9]{1,32}" maxlength="32" placeholder="播放地址中的数字">
        </div>
      </details>
      <div class="field">
        <label for="filename">文件名</label>
        <input id="filename" placeholder="例如 我的影片">
        <p class="hint" id="file-preview">留空时使用播放页编号，自动添加 .mp4。</p>
      </div>
      <div class="field">
        <label for="directory">保存位置</label>
        <div class="field-row">
          <input id="directory" class="mono" placeholder="/Users/…" spellcheck="false" required>
          <button type="button" id="pick">选择文件夹</button>
        </div>
      </div>
      <details class="source-tools">
        <summary>指定本地中文字幕（可选）</summary>
        <div class="field-row">
          <input class="mono" id="subtitle" aria-label="中文字幕文件路径" placeholder="/Users/…/中文字幕.srt">
          <button type="button" id="pick-subtitle">选择字幕</button>
        </div>
        <p class="hint source-note">默认保留片源中标为中文的独立字幕。可指定本地 SRT、VTT、ASS 或 SSA。</p>
      </details>
      <button type="submit" class="primary" id="start">开始下载 MP4</button>
      <p class="message error" role="alert" id="form-error" hidden></p>
      </div>
    </form>
    <section class="card" aria-labelledby="status-title">
      <div class="panel-head">
        <h2 id="status-title">下载状态</h2>
        <span id="state" class="state">待下载</span>
      </div>
      <div class="panel-body">
      <p class="phase" id="phase" role="status">提交下载后，这里会显示分片进度和输出文件。</p>
      <div id="progress-group" hidden>
        <div class="progress-heading">
          <span id="segments"></span>
          <span id="percentage" class="percentage"></span>
        </div>
        <progress id="progress" max="100" aria-label="分片下载进度"></progress>
      </div>
      <p class="message error" id="job-error" role="alert" hidden></p>
      <div class="result" id="result" hidden>
        <strong>保存的文件</strong>
        <p class="mono" id="output"></p>
        <button type="button" id="reveal">在 Finder 中显示</button>
      </div>
      <details id="details" hidden>
        <summary>下载日志</summary>
        <pre id="log"></pre>
      </details>
      </div>
    </section>
  </div>
</main>
<dialog class="card" id="folder-dialog" aria-labelledby="folder-title">
  <h2 id="folder-title">选择保存位置</h2>
  <p class="mono hint" id="folder-path"></p>
  <div class="folder-actions">
    <button type="button" id="folder-up">上一级</button>
    <button type="button" id="folder-native">在 macOS 中选择…</button>
  </div>
  <div class="folder-actions source-note" id="shortcuts"></div>
  <p class="message error" id="folder-error" role="alert" hidden></p>
  <div class="folder-list" id="folders"></div>
  <button type="button" class="primary" id="folder-confirm">使用此文件夹</button>
  <form method="dialog"><button type="submit">取消</button></form>
</dialog>
<script>
  const byId = (id) => document.getElementById(id);
  const form = byId("download");
  const url = byId("url");
  const number = byId("number");
  const page = byId("page");
  const filename = byId("filename");
  const subtitle = byId("subtitle");
  const directory = byId("directory");
  const start = byId("start");
  const progress = byId("progress");
  const log = byId("log");
  let submitting = false;
  let latestJob = null;
  let closed = false;
  const tabId = crypto.randomUUID();
  const sessionToken = "__M3U8_SESSION_TOKEN__";
  let sources = [];
  let sourceRequest = 0;
  let suggestedName = "";

  function setText(id, value) {
    const element = byId(id);
    if (element.textContent !== value) element.textContent = value;
  }

  function formError(message = "") {
    setText("form-error", message);
    byId("form-error").hidden = !message;
  }

  async function post(path, data) {
    const response = await fetch(path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...data, sessionToken}),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    return result;
  }

  function render(job) {
    latestJob = job;
    const active = job?.state === "running";
    start.disabled = submitting || active;
    start.textContent = active ? "正在下载…" : "开始下载 MP4";
    if (!job) return;
    const state = byId("state");
    state.dataset.state = job.state;
    setText("state", {running: "进行中", complete: "已完成", error: "失败"}[job.state]);
    setText("phase", `${job.phase} · ${job.filename || job.number}`);
    const hasProgress = job.progress !== null;
    byId("progress-group").hidden = !(active || hasProgress);
    if (hasProgress) progress.value = job.progress;
    else progress.removeAttribute("value");
    setText("segments", job.segments ? `分片 ${job.segments}` : "分片进度");
    setText("percentage", hasProgress ? `${Number(job.progress.toFixed(1))}%` : "");
    setText("job-error", job.error ?? "");
    byId("job-error").hidden = !job.error;
    byId("result").hidden = !job.file;
    setText("output", job.file ?? "");
    byId("details").hidden = !job.log.length;
    const followLog = log.scrollHeight - log.scrollTop - log.clientHeight < 35;
    setText("log", job.log.join("\n"));
    if (followLog) log.scrollTop = log.scrollHeight;
  }

  async function refresh() {
    const response = await fetch("/api/status?tab=" + tabId);
    if (!response.ok) throw new Error("无法连接本地下载服务。");
    const status = await response.json();
    if (!directory.dataset.initialized) {
      directory.value ||= localStorage.getItem("m3u8-directory") || status.directory;
      directory.dataset.initialized = "true";
    }
    if (!closed) {
      render(status.job);
      if (!status.job) {
        byId("state").dataset.state = "idle";
        setText("state", "待下载");
        byId("job-error").hidden = true;
      }
    }
  }

  async function poll() {
    if (closed) return;
    try {
      await refresh();
    } catch {
      if (closed) return;
      byId("state").dataset.state = "offline";
      setText("state", "已断开");
      setText("job-error", "本地下载服务已断开。请重新打开启动器。");
      byId("job-error").hidden = false;
    }
    setTimeout(poll, latestJob?.state === "running" ? 750 : 2000);
  }

  function previewFilename() {
    const stem = filename.value.trim().replace(/\.mp4$/i, "").trim() || number.value;
    setText("file-preview", stem ? `将保存为 ${stem}.mp4` : "留空时使用播放页编号，自动添加 .mp4。");
  }
  number.addEventListener("input", previewFilename);
  filename.addEventListener("input", previewFilename);

  function resolveNote(message, href) {
    const note = byId("resolve-note");
    note.hidden = !message;
    note.textContent = message;
    if (href) {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "打开播放页";
      note.append(" ", link);
    }
  }

  function showSources(result, fromPage = false) {
    number.value = String(result.number ?? "");
    if (result.title && (!filename.value.trim() || filename.value === suggestedName)) {
      suggestedName = String(result.title).replace(/[/:]/g, " ").trim();
      filename.value = suggestedName;
    }
    sources = Array.isArray(result.sources) ? result.sources.filter((source) => {
      try { return /^https?:$/.test(new URL(source.url).protocol); }
      catch { return false; }
    }).slice(0, 100) : [];
    const chinese = (source) => /中字|中文|简中|繁中/.test(source.label);
    sources.sort((a, b) => Number(chinese(b)) - Number(chinese(a))
      || (fromPage ? Number(!!b.active) - Number(!!a.active) : 0));
    byId("sources").replaceChildren(...sources.map((source, i) =>
      new Option([source.line, source.label].filter(Boolean).join(" · ") || `线路 ${i + 1}`, i)
    ));
    byId("source-options").hidden = !sources.length;
    url.value = sources[0]?.url ?? "";
    previewFilename();
    resolveNote(sources.length ? `已找到 ${sources.length} 条线路。` :
      "本地请求未能读到线路。请打开播放页，点击「导入到 M3U8 下载器」书签。", result.page);
  }

  byId("sources").addEventListener("change", (event) => {
    url.value = sources[Number(event.target.value)].url;
  });

  async function resolvePage() {
    const request = ++sourceRequest;
    const button = byId("resolve");
    button.disabled = true;
    resolveNote("正在读取播放页…");
    try {
      const result = await post("/api/resolve", {page: page.value.trim()});
      if (request !== sourceRequest) return false;
      showSources(result);
      return !!sources.length;
    } catch (error) {
      resolveNote(error.message);
      return false;
    } finally {
      button.disabled = false;
    }
  }
  byId("resolve").addEventListener("click", resolvePage);
  page.addEventListener("input", () => {
    sourceRequest++;
    if (sources.length) {
      sources = [];
      url.value = "";
      number.value = "";
      byId("source-options").hidden = true;
      previewFilename();
    }
    resolveNote("");
  });
  page.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      if (!byId("resolve").disabled) resolvePage();
    }
  });

  function importFromPlayPage(localPage) {
    const match = location.pathname.match(/^\/play\/([0-9]+)(?:[/.]|$)/);
    if (!/^(www[0-9]*\.)?ikanbot\.com$/.test(location.hostname) || !match) {
      alert("请在 ikanbot 播放页点击这个书签。");
      return;
    }
    const sources = [...document.querySelectorAll('#lineContent [name="lineData"][udata]')]
      .map((element) => ({
        url: new URL(element.getAttribute("udata"), location.href).href,
        line: element.closest("ul")?.querySelector(".line-name")?.textContent.trim() || "",
        label: element.textContent.trim(),
        active: element.classList.contains("active"),
      })).filter((source) => /^https?:\/\//.test(source.url) && /\.m3u8(?:[?#]|$)/i.test(source.url));
    if (!sources.length) {
      alert("当前播放页暂无可导入的线路。");
      return;
    }
    const data = {
      number: match[1], title: document.querySelector("#video_title")?.textContent.trim(), sources,
    };
    window.open(localPage + "#import=" + encodeURIComponent(JSON.stringify(data)), "m3u8-downloader");
  }
  const bookmark = byId("bookmark");
  bookmark.href = "javascript:" + encodeURIComponent(
    `void((${importFromPlayPage.toString()})(${JSON.stringify(location.origin + "/")}))`
  );
  bookmark.addEventListener("click", (event) => event.preventDefault());
  function readImport() {
    if (!location.hash.startsWith("#import=")) return;
    try {
      const data = JSON.parse(decodeURIComponent(location.hash.slice(8)));
      if (!/^[0-9]{1,32}$/.test(data.number)) throw new Error("播放页编号无效。");
      page.value = data.number;
      showSources(data, true);
    } catch {
      resolveNote("无法读取导入数据。请回到播放页再点击一次书签。");
    }
    history.replaceState(null, "", "/");
  }
  addEventListener("hashchange", readImport);
  readImport();

  byId("paste").addEventListener("click", async () => {
    formError();
    try {
      url.value = (await navigator.clipboard.readText()).trim();
    } catch {
      formError("请按 ⌘V 粘贴链接。");
    }
    url.focus();
  });

  const folderDialog = byId("folder-dialog");
  let currentFolder;
  let folderRequest = 0;

  async function browse(directory) {
    const request = ++folderRequest;
    const errorBox = byId("folder-error");
    errorBox.hidden = true;
    byId("folder-confirm").disabled = true;
    try {
      const result = await post("/api/pick", {directory});
      if (request !== folderRequest) return;
      currentFolder = result.directory;
      setText("folder-path", currentFolder);
      byId("folder-confirm").disabled = false;
      byId("shortcuts").replaceChildren(...result.shortcuts.map(folderButton));
      byId("folder-up").disabled = result.parent === currentFolder;
      byId("folder-up").onclick = () => browse(result.parent);
      byId("folders").replaceChildren(...result.folders.map(folderButton));
      if (result.inaccessible) {
        setText("folder-error", "macOS 限制了对此目录的读取。可用系统选择器浏览，写入时仍需终端有访问权限。");
        errorBox.hidden = false;
      } else if (!result.folders.length) {
        byId("folders").textContent = "此位置没有子文件夹。";
      }
    } catch (error) {
      if (request !== folderRequest) return;
      setText("folder-error", error.message);
      errorBox.hidden = false;
    }
  }

  function folderButton(folder) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = folder.name;
    button.onclick = () => browse(folder.path);
    return button;
  }

  byId("pick").addEventListener("click", () => {
    formError();
    folderDialog.showModal();
    browse(directory.value);
  });

  byId("folder-confirm").addEventListener("click", () => {
    if (currentFolder) directory.value = currentFolder;
    folderDialog.close();
  });
  async function nativePicker(button, file) {
    button.disabled = true;
    formError();
    try {
      const result = await post("/api/pick", {directory: directory.value, native: true, file});
      if (result.selected) {
        if (file) subtitle.value = result.selected;
        else {
          directory.value = result.selected;
          folderDialog.close();
        }
      }
    } catch (error) {
      if (file) formError(error.message);
      else {
        setText("folder-error", error.message);
        byId("folder-error").hidden = false;
      }
    } finally {
      button.disabled = false;
    }
  }
  byId("folder-native").onclick = (event) => nativePicker(event.currentTarget, false);
  byId("pick-subtitle").onclick = (event) => nativePicker(event.currentTarget, true);

  byId("reveal").addEventListener("click", async () => {
    formError();
    try {
      await post("/api/reveal", {});
    } catch (error) {
      formError(error.message);
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submitting || latestJob?.state === "running") return;
    submitting = true;
    start.disabled = true;
    formError();
    byId("details").open = false;
    try {
      if (!url.value.trim() && page.value.trim() && !await resolvePage()) return;
      if (!url.value.trim() || !number.value.trim()) {
        byId("manual").open = true;
        throw new Error("请选择一条播放线路，或填写 M3U8 链接和编号。");
      }
      await post("/api/download", {
        url: url.value.trim(), number: number.value.trim(), directory: directory.value.trim(),
        filename: filename.value.trim(), subtitle: subtitle.value.trim(),
      });
      localStorage.setItem("m3u8-directory", directory.value);
      await refresh();
    } catch (error) {
      formError(error.message);
    } finally {
      submitting = false;
      start.disabled = latestJob?.state === "running";
    }
  });

  addEventListener("pagehide", () => {
    if (!closed) navigator.sendBeacon("/api/leave", new Blob(
      [JSON.stringify({tab: tabId, sessionToken})], {type: "application/json"}
    ));
  });
  byId("exit").addEventListener("click", async () => {
    try {
      closed = true;
      await post("/api/leave", {close: true});
      const message = latestJob?.state === "running"
        ? "服务已关闭。当前下载会继续，完成后可在保存文件夹中查看。"
        : "服务已关闭。再次使用时请双击「M3U8 下载器」或运行 start.sh。";
      byId("exit").disabled = true;
      document.querySelector("main").textContent = message;
    } catch (error) {
      closed = false;
      formError(error.message);
    }
  });
  poll();
</script>
</body>
</html>
